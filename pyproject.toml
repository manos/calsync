[project]
name = "calsync"
version = "0.1.0"
description = "Stateless one-way calendar mirroring between Google Calendar and CalDAV"
requires-python = ">=3.13"
dependencies = [
    "caldav",
    "icalendar",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "pydantic",
    "pyyaml",
    "recurring-ical-events",
]

[project.scripts]
calsync = "calsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Specs and plans embed illustrative code blocks; they are documentation, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
calsync = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."
fmt = "ruff format ."
